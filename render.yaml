services:
  - type: web
    name: sga-cal-miranda-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/schema/
    envVars:
      - key: PORT
        value: "8000"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: sga-cal-miranda-api.onrender.com,sga-cal-miranda-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://sga-cal-miranda-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://sga-cal-miranda-web.onrender.com
      - key: AUTH_COOKIE_SAMESITE
        value: Lax
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require

  - type: web
    name: sga-cal-miranda-web
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /login
    envVars:
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_API_URL
        value: /
      - key: INTERNAL_API_ORIGIN
        value: https://sga-cal-miranda-api.onrender.com
